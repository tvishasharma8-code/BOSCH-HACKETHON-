# Shared settings. Each member edits only their own labeled section (README Section 9).

# --- shared (C owns structure) ---
endpoints:
  prometheus: http://localhost:9090
  jaeger: http://localhost:8080/jaeger/ui   # v3 API: /api/v3/services, /api/v3/traces
  logs: docker
  action_api: http://127.0.0.1:8700
# Never queried by agent tools: diagnosis must come from telemetry, not flags (R4).
excluded_services: [flagd, flagd-ui]
excluded_labels: ["envkit.helper=true"]

# --- B (Mohit; covered by Tvisha): redaction, log tool, bundles, reports ---
# The vocabulary of what must never reach the model lives HERE, not in agent/.
# The forbidden-access guard (README Section 1) fails any file under agent/ that
# contains these words, so agent code reads them from config instead of naming them.
redaction:
  # Attribute / dict keys starting with any of these are dropped.
  attr_prefixes: [feature_flag, openfeature]
  # Free-text lines matching any of these are dropped entirely (case-insensitive).
  # Covers flag-evaluation chatter in service logs and the flag daemon's own output.
  line_patterns:
    - 'feature[_ ]?flag'
    - 'openfeature'
    - 'flagd'
    - 'flag evaluation'
    - 'variant\s*[:=]'
  # Free-text fields that are allowlisted by key but can still echo a flag name
  # in their value (a stack trace, an error message).
  scrub_values_for_keys: [exception.message, error.type, summary]
  placeholder: "[redacted]"
  # Only containers in this compose project are visible to agent tools. An
  # allowlist, so faultctl's unlabelled netem helper is excluded automatically (R13).
  compose_project: opentelemetry-demo

# --- A (Hemanth): metrics, traces, alerting, verification ---
metrics:
  default_window: 5m
  max_window_minutes: 60
  range_step_s: 30
  http_timeout_s: 5
  # Dynamic flagging: compare each service to its own normal.
  baseline_minutes: 30        # "normal" = this many minutes...
  baseline_skip_minutes: 5    # ...ending this long ago, so the incident itself isn't counted as normal
  worse_factor: 3             # flag when 3x worse than its own normal
  error_ratio_floor: 0.01     # and at least 1% errors (ignores 0.1% -> 0.3%)
  p95_floor_ms: 200           # and p95 at least 200 ms
  request_rate_floor: 1.0     # traffic spike must also be >= 1 req/s
  trend_minutes: 10           # steady-rise check for memory/CPU
  trend_min_rise: 0.2         # rose by >= 20% ...
  trend_min_rising_share: 0.7 # ... with >= 70% of steps going up
  trend_cpu_floor_cores: 0.1          # CPU trend only counts once it uses >= 0.1 cores
  trend_memory_min_rise_bytes: 52428800  # memory trend must grow by >= 50 MB

# --- C (Tvisha): LLM, investigator, planner ---
# gemini-3.8-flash answered 503 "high demand" on every Phase 0 attempt, so the
# fallback chain is load-bearing, not a refinement. max_cost_usd is a
# placeholder: set it from measured usageMetadata after the first full run.
llm:
  provider: gemini
  model: gemini-3.8-flash
  fallbacks: [gemini-3.5-flash, gemini-2.5-flash]
  temperature: 0
  timeout_s: 60
  max_retries: 2
  max_cost_usd: 5

investigation:
  max_steps: 12
  max_tool_output_tokens: 1500
  lookback_minutes: 15

# --- D (Pavan): evidence, diagnosis, confidence policy ---
policy:
  min_confidence_to_act: 0.7
  high_confidence_requires_types: 2

# --- A (Hemanth): alerting and verification thresholds ---
alert:
  poll_s: 15
  error_rate_threshold: 0.05
  p95_latency_ms: 1500
  debounce_polls: 2

verify:
  settle_s: 30
  timeout_s: 180
  consecutive_ok: 3

# --- E (Aditi): approval and execution mode ---
approval:
  timeout_s: 600

mode:
  dry_run_default: true
