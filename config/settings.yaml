# Incident Zero settings.
# One labelled section per member — edit only your own section (README section 9).

# ---- owner C ----------------------------------------------------------------
# All hosts must be local (R6); agent/config.py rejects anything else.
# Jaeger is NOT on localhost:16686 (port not mapped to the host). Reach it
# through the frontend proxy and use the v3 API — the old /api/traces 404s:
#   GET {jaeger}/api/v3/services
#   GET {jaeger}/api/v3/traces?query.service_name=X&query.start_time_min=...
# Logs: the collector ships to OpenSearch but its port is not published, so the
# log tool reads Docker logs through the read-only wrapper (owner B).
endpoints:
  prometheus: http://localhost:9090
  jaeger: http://localhost:8080/jaeger/ui
  logs: docker
  action_api: http://127.0.0.1:8700

# ---- owner B ----------------------------------------------------------------
# Never visible to the agent's tools (R4, R13).
excluded_services: [flagd, flagd-ui]
excluded_labels: ["envkit.helper=true"]

# ---- owner C ----------------------------------------------------------------
# gemini-3.8-flash returned 503 "high demand" on every Phase 0 attempt; the
# fallback chain is load-bearing, not a nicety. max_cost_usd is a placeholder —
# set it from measured usageMetadata after the first full run.
llm:
  provider: gemini
  model: gemini-3.8-flash
  fallbacks: [gemini-3.5-flash, gemini-2.5-flash]
  temperature: 0
  timeout_s: 60
  max_retries: 2
  max_cost_usd: 5

investigation:
  max_steps: 12
  max_tool_output_tokens: 1500
  lookback_minutes: 15

# ---- owner D ----------------------------------------------------------------
policy:
  min_confidence_to_act: 0.7
  high_confidence_requires_types: 2

# ---- owner A ----------------------------------------------------------------
alert:
  poll_s: 15
  error_rate_threshold: 0.05
  p95_latency_ms: 1500
  debounce_polls: 2

verify:
  settle_s: 30
  timeout_s: 180
  consecutive_ok: 3

# ---- owner E ----------------------------------------------------------------
approval:
  timeout_s: 600

mode:
  dry_run_default: true
